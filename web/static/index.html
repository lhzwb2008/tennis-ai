<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>网球挥拍测评 2.0</title>
  <style>
    :root {
      --bg: #07110c;
      --panel: rgba(18, 32, 26, .72);
      --line: #2d4a3a;
      --text: #eef6ee;
      --muted: #8ea196;
      --ball: #d4e157;
      --ball-2: #9ccc3c;
      --gold: #e0b25c;
      --good: #5dcea2;
      --warn: #e0b25c;
      --bad: #e07a7a;
      --paper: #f3eee3;
      --ink: #15231c;
      --ink-muted: #5c6b62;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font: 15px/1.6 "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 85% -8%, rgba(212,225,87,.16), transparent 55%),
        radial-gradient(700px 420px at -10% 110%, rgba(31,90,64,.35), transparent 50%),
        linear-gradient(180deg, #08140e, #050a08 40%, #07110c);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(212,225,87,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212,225,87,.05) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 20%, #000 30%, transparent 75%);
      animation: gridDrift 28s linear infinite;
    }
    @keyframes gridDrift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 48px 48px, 48px 48px; }
    }
    .orb {
      position: fixed; width: 18px; height: 18px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f6ffb0, var(--ball) 45%, #6a8a20);
      box-shadow: 0 0 18px rgba(212,225,87,.55);
      pointer-events: none; z-index: 1;
      animation: floatBall 9s ease-in-out infinite;
    }
    .orb.b2 { width: 10px; height: 10px; animation-duration: 13s; animation-delay: -4s; opacity: .7; }
    @keyframes floatBall {
      0%, 100% { transform: translate(6vw, 12vh); }
      40% { transform: translate(78vw, 22vh); }
      70% { transform: translate(40vw, 8vh); }
    }
    .wrap { position: relative; z-index: 2; max-width: 1120px; margin: 0 auto; padding: 28px 22px 80px; }
    header.hero { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; margin-bottom: 28px; }
    .brand {
      display: inline-flex; align-items: center; gap: 8px;
      letter-spacing: .2em; font-size: 11px; color: var(--ball); text-transform: uppercase;
    }
    .ver {
      letter-spacing: .08em; font-size: 10px; color: #15200f; background: var(--ball);
      border-radius: 999px; padding: 2px 8px; font-weight: 700;
      box-shadow: 0 0 16px rgba(212,225,87,.45);
    }
    h1 { margin: 8px 0 6px; font-size: 34px; font-weight: 650; letter-spacing: -.03em; }
    .sub { margin: 0; color: var(--muted); max-width: 640px; }
    .ghost {
      background: rgba(255,255,255,.04); color: var(--muted); border: 1px solid var(--line);
      border-radius: 999px; padding: 8px 14px; cursor: pointer; font: inherit;
      backdrop-filter: blur(8px);
    }
    .drop {
      border: 1px dashed #3d5347; border-radius: 22px; padding: 40px 28px;
      background: linear-gradient(180deg, rgba(21,40,30,.75), rgba(12,20,16,.8));
      text-align: center; backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(212,225,87,.08);
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }
    .drop.over {
      border-color: var(--ball);
      box-shadow: 0 0 0 1px rgba(212,225,87,.35), 0 24px 70px rgba(212,225,87,.12);
      transform: translateY(-2px);
    }
    .drop h2 { margin: 0 0 8px; font-size: 22px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
    select, .btn {
      font: inherit; border-radius: 999px; padding: 10px 16px; border: 1px solid var(--line);
      background: var(--panel); color: var(--text);
    }
    .btn.primary {
      background: linear-gradient(180deg, #e4f36a, var(--ball));
      color: #15200f; border-color: transparent; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 24px rgba(212,225,87,.28);
      animation: pulseGlow 2.6s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 8px 24px rgba(212,225,87,.25); }
      50% { box-shadow: 0 8px 32px rgba(212,225,87,.5); }
    }
    .btn { cursor: pointer; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 14px; }
    .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0 0; }
    .pillar {
      text-align: left; padding: 12px 14px; border-radius: 14px;
      border: 1px solid rgba(45,74,58,.8); background: rgba(10,20,15,.45);
      font-size: 12px; color: var(--muted);
    }
    .pillar b { display: block; color: var(--text); font-size: 13px; margin-bottom: 4px; }
    .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 22px 0; }
    .step {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
      color: var(--muted); font-size: 12px; backdrop-filter: blur(10px);
    }
    .step b { display: block; color: var(--text); font-size: 13px; margin-bottom: 4px; }
    .step.on { border-color: var(--ball); color: #cfe39a; box-shadow: 0 0 18px rgba(212,225,87,.15); }
    .step .eta { display: block; margin-top: 6px; font-size: 11px; opacity: .85; }
    .progress {
      height: 8px; background: #223028; border-radius: 99px; overflow: hidden; margin: 8px 0 18px;
    }
    .progress > i {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #7fa83a, var(--ball), #fff4a0);
      background-size: 200% 100%;
      animation: barShine 1.6s linear infinite;
      transition: width .35s;
    }
    @keyframes barShine { to { background-position: 200% 0; } }
    .live { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px;
      backdrop-filter: blur(12px);
    }
    .card h3 { margin: 0 0 10px; font-size: 14px; }
    .preview-box {
      width: 100%; aspect-ratio: 16/10; background: #000; border-radius: 10px; overflow: hidden;
      position: relative;
    }
    .preview-box::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(180deg, transparent, transparent 3px, rgba(212,225,87,.04) 4px);
      animation: scan 3.5s linear infinite;
    }
    @keyframes scan { from { transform: translateY(-20%); } to { transform: translateY(20%); } }
    .preview { width: 100%; height: 100%; object-fit: cover; display: block; }
    .paper {
      background: var(--paper); color: var(--ink); border-radius: 20px; padding: 36px 40px 48px;
      box-shadow: 0 30px 80px rgba(0,0,0,.4);
      animation: riseIn .55s ease;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }
    .paper h1, .paper h2, .paper h3 { color: var(--ink); }
    .cover {
      display: grid; grid-template-columns: 1.3fr .7fr; gap: 28px; padding-bottom: 28px;
      border-bottom: 1px solid #ddd4c4; margin-bottom: 28px;
    }
    .kicker { letter-spacing: .2em; font-size: 11px; color: #8a7040; }
    .paper h1 { font-family: Palatino, "Iowan Old Style", "Songti SC", serif; font-size: 34px; margin: 6px 0 8px; }
    .meta { color: var(--ink-muted); font-size: 13px; }
    .score-ring {
      width: 176px; height: 176px; border-radius: 50%; margin: 0 auto;
      display: grid; place-items: center; color: var(--paper);
      background: conic-gradient(var(--gold) calc(var(--p) * 1%), #d9d0c0 0);
      animation: spinIn 1.1s ease;
    }
    @keyframes spinIn { from { filter: saturate(.4); transform: scale(.92); } to { filter: none; transform: none; } }
    .score-ring .inner {
      width: 132px; height: 132px; border-radius: 50%; background: var(--paper); color: var(--ink);
      display: grid; place-items: center; text-align: center;
    }
    .score-ring .n { font-size: 42px; font-weight: 700; line-height: 1; }
    .score-ring .g { font-size: 12px; color: #8a7040; letter-spacing: .12em; }
    .axis-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 8px 0 22px; }
    .axis {
      background: #fffdf8; border: 1px solid #e6dccb; border-radius: 14px; padding: 12px 14px;
    }
    .axis .lab { font-size: 12px; color: var(--ink-muted); }
    .axis .val { font-size: 22px; font-weight: 700; margin: 4px 0 8px; }
    .axis .track { height: 6px; background: #e5dccb; border-radius: 99px; overflow: hidden; }
    .axis .track i {
      display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1f4a38, #c9a24a);
      transition: width .8s ease;
    }
    .scores { display: grid; grid-template-columns: 220px 1fr; gap: 24px; margin: 8px 0 28px; }
    .bars .bar { display: grid; grid-template-columns: 78px 1fr 36px; gap: 8px; align-items: center; margin: 8px 0; font-size: 13px; }
    .bars .track { height: 8px; background: #e5dccb; border-radius: 99px; overflow: hidden; }
    .bars .track i { display: block; height: 100%; background: #1f4a38; }
    .grid2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; }
    .panel {
      background: #fffdf8; border: 1px solid #e6dccb; border-radius: 12px; padding: 14px 16px;
    }
    .panel h3 { margin: 0 0 8px; font-size: 14px; }
    .improve { margin: 14px 0 18px; }
    .improve p.focus { margin: 0 0 10px; font-weight: 650; }
    svg.chart { width: 100%; height: 150px; display: block; }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 6px 0; }
    .tabs { display: flex; gap: 8px; margin: 8px 0 14px; }
    .tab {
      border: 1px solid #d9d0c0; background: transparent; border-radius: 999px; padding: 6px 14px;
      cursor: pointer; font: inherit; color: var(--ink-muted);
    }
    .tab.on { background: #1f4a38; color: #f4efe4; border-color: #1f4a38; }
    .swing { border: 1px solid #e6dccb; border-radius: 12px; overflow: hidden; background: #fffdf8; margin-top: 12px; }
    .swing .barline {
      display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 12px; font-size: 12px; color: var(--ink-muted);
      border-bottom: 1px solid #eee6d8;
    }
    .phases { display: grid; grid-template-columns: repeat(4, 1fr); }
    .phases figure { margin: 0; }
    .phases img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: #111; }
    .phases figcaption { font-size: 11px; color: var(--ink-muted); padding: 6px 8px 10px; }
    .pill { font-size: 11px; border: 1px solid #d9d0c0; border-radius: 999px; padding: 2px 8px; }
    .pill.bad { color: #a33; border-color: #e8b4b4; }
    .pill.ok { color: #1f4a38; border-color: #b7d4c4; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin: 0 0 16px; }
    .note { color: var(--ink-muted); font-size: 12px; margin-top: 22px; }
    .hidden { display: none !important; }
    video.overlay { width: 100%; border-radius: 12px; background: #000; max-height: 360px; }
    @media (max-width: 860px) {
      .cover, .scores, .grid2, .live, .steps, .phases, .pillars, .axis-grid { grid-template-columns: 1fr 1fr; }
      .paper { padding: 22px 16px 32px; }
      header.hero { flex-direction: column; align-items: flex-start; }
      .steps { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .pillars, .axis-grid, .phases { grid-template-columns: 1fr; }
    }
    @media print {
      body { background: white; }
      .no-print, .orb, body::before { display: none !important; }
      .paper { box-shadow: none; padding: 0; animation: none; }
      .wrap { padding: 0; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="orb no-print"></div>
  <div class="orb b2 no-print"></div>
  <div class="wrap">
    <header class="hero no-print">
      <div>
        <div class="brand">网球测评 <span class="ver">2.0</span></div>
        <h1>上传视频，生成挥拍测评报告</h1>
        <p class="sub">围绕重心、击球点、动力链和击球效果，找出每一次挥拍，给出评分和练习建议。</p>
      </div>
      <button class="ghost" id="again" type="button" hidden>再分析一段</button>
    </header>

    <section id="upload" class="no-print">
      <div class="drop" id="drop">
        <h2>把训练视频拖到这里</h2>
        <p class="sub" style="margin:0 auto">建议侧面拍摄，人尽量完整入画，这样更容易看清击球。自己上传请用 1 分钟左右的录像，我们会按整段分析。</p>
        <div class="row">
          <select id="stroke">
            <option value="auto" selected>自动识别正反手</option>
            <option value="forehand">只按正手</option>
            <option value="backhand">只按反手</option>
          </select>
          <button class="btn" id="pick" type="button">选择文件</button>
          <button class="btn primary" id="sample" type="button">分析 1 分钟样例</button>
        </div>
        <p class="hint" id="busy" hidden></p>
        <input id="file" type="file" accept="video/mp4,video/quicktime,video/webm" hidden />
        <p class="hint">支持 mp4 / mov / webm。样例是侧面训练录像，会分析前 60 秒；分析过一次后再次点击会直接打开报告。</p>
        <div class="pillars">
          <div class="pillar"><b>重心</b>越稳越好，尽量保持低重心</div>
          <div class="pillar"><b>击球点</b>打在身体侧前方，不要贴身偏晚</div>
          <div class="pillar"><b>动力链</b>身体先动、手臂后到，避免伤病</div>
          <div class="pillar"><b>击球效果</b>看拍头速度，以及旋转轨迹</div>
        </div>
      </div>
    </section>

    <section id="analyzing" class="hidden no-print">
      <div class="steps" id="steps"></div>
      <div class="progress"><i id="bar"></i></div>
      <p id="msg" class="sub">准备中…</p>
      <div class="live">
        <div class="card">
          <h3>分析预览</h3>
          <div class="preview-box">
            <img class="preview hidden" id="preview" alt="" />
          </div>
        </div>
        <div class="card">
          <h3>当前步骤</h3>
          <p id="detail" style="margin:0;color:var(--muted)"></p>
        </div>
      </div>
    </section>

    <section id="report" class="hidden"></section>
  </div>

  <script>
    const STEPS = [
      ["读取视频", "打开你的录像", "约 15 秒"],
      ["识别动作", "看清挥拍动作", "约 3–4 分钟"],
      ["找出挥拍", "标出每一次击球", "约 30 秒"],
      ["整理数据", "整理评分依据", "约 1 分钟"],
      ["教练点评", "生成练习建议", "约 2 分钟，最慢"],
    ];
    const JOB_KEY = "tennis-ai-active-job";
    const AXES = [
      ["重心", 25],
      ["击球点", 20],
      ["动力链", 30],
      ["击球效果", 25],
    ];
    const $ = (id) => document.getElementById(id);
    const upload = $("upload"), analyzing = $("analyzing"), reportEl = $("report");
    const drop = $("drop"), file = $("file");

    function paintSteps(step, etaSteps) {
      $("steps").innerHTML = STEPS.map((s, i) => {
        const n = i + 1;
        const cls = n < step ? "done" : n === step ? "on" : "";
        const eta = (etaSteps && etaSteps[i] && etaSteps[i].label) || s[2];
        return `<div class="step ${cls}"><b>${n}. ${s[0]}</b>${s[1]}<span class="eta">${esc(eta)}</span></div>`;
      }).join("");
    }
    paintSteps(0);

    function saveJob(id) {
      try { localStorage.setItem(JOB_KEY, id); } catch (e) {}
    }
    function clearJob() {
      try { localStorage.removeItem(JOB_KEY); } catch (e) {}
    }

    $("pick").onclick = () => file.click();
    $("again").onclick = () => { clearJob(); location.reload(); };
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = (e) => {
      e.preventDefault(); drop.classList.remove("over");
      if (e.dataTransfer.files[0]) startUpload(e.dataTransfer.files[0]);
    };
    file.onchange = () => { if (file.files[0]) startUpload(file.files[0]); };
    $("sample").onclick = () => startUpload(null, true);

    async function startUpload(f, sample=false) {
      const fd = new FormData();
      fd.append("stroke", $("stroke").value);
      fd.append("sample", sample ? "1" : "0");
      if (f) fd.append("video", f);
      const busy = $("busy");
      if (busy) { busy.hidden = true; busy.textContent = ""; }
      if (!sample) {
        upload.classList.add("hidden");
        analyzing.classList.remove("hidden");
        paintSteps(1);
        $("msg").textContent = "正在提交任务…";
      }
      const res = await fetch("api/analyze", { method: "POST", body: fd });
      if (!res.ok) {
        let msg = "提交失败，请稍后再试";
        try {
          const body = await res.json();
          msg = body.detail || msg;
        } catch (e) {}
        upload.classList.remove("hidden");
        analyzing.classList.add("hidden");
        $("again").hidden = true;
        if (busy) {
          busy.hidden = false;
          busy.textContent = msg;
        } else {
          $("msg").textContent = msg;
        }
        return;
      }
      const { job_id, cached } = await res.json();
      if (cached) {
        clearJob();
        upload.classList.add("hidden");
        analyzing.classList.add("hidden");
        const r = await fetch("api/jobs/" + job_id + "/report");
        const data = await r.json();
        showReport(data);
        return;
      }
      saveJob(job_id);
      upload.classList.add("hidden");
      analyzing.classList.remove("hidden");
      paintSteps(1);
      $("msg").textContent = "正在提交任务…";
      poll(job_id);
    }

    async function poll(id) {
      saveJob(id);
      const res = await fetch("api/jobs/" + id);
      if (!res.ok) {
        clearJob();
        $("msg").textContent = "任务不存在，请重新分析";
        $("again").hidden = false;
        return;
      }
      const job = await res.json();
      $("bar").style.width = (job.progress || 0) + "%";
      paintSteps(job.step || 1, job.eta_steps);
      $("msg").textContent = job.message || "";
      $("detail").innerHTML = `
        ${esc(job.source_name || "")}<br/>
        ${esc(job.step_name || "分析中")} · ${job.progress || 0}%<br/>
        <span>${esc(job.eta_hint || "")}</span>`;
      if (job.preview_rev) {
        const img = $("preview");
        const next = "api/jobs/" + id + "/preview?r=" + job.preview_rev;
        img.classList.remove("hidden");
        if (img.dataset.rev !== String(job.preview_rev)) {
          img.dataset.rev = String(job.preview_rev);
          img.src = next;
        }
      }
      if (job.status === "done") {
        clearJob();
        const r = await fetch("api/jobs/" + id + "/report");
        const data = await r.json();
        showReport(data);
        return;
      }
      if (job.status === "error" || job.status === "cancelled") {
        clearJob();
        $("msg").textContent = "分析失败：" + (job.message || job.error || "请稍后重试");
        $("again").hidden = false;
        return;
      }
      setTimeout(() => poll(id), 700);
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    }

    function radar(scores) {
      const axes = AXES;
      const cx = 100, cy = 100, r = 78;
      const pts = axes.map((a, i) => {
        const ang = -Math.PI / 2 + i * (2 * Math.PI / axes.length);
        const v = (scores[a[0]] || 0) / a[1];
        return [cx + Math.cos(ang) * r * v, cy + Math.sin(ang) * r * v];
      });
      const grid = [0.4, 0.7, 1].map((k) => {
        const g = axes.map((a, i) => {
          const ang = -Math.PI / 2 + i * (2 * Math.PI / axes.length);
          return `${cx + Math.cos(ang) * r * k},${cy + Math.sin(ang) * r * k}`;
        }).join(" ");
        return `<polygon points="${g}" fill="none" stroke="#e5dccb" />`;
      }).join("");
      const labels = axes.map((a, i) => {
        const ang = -Math.PI / 2 + i * (2 * Math.PI / axes.length);
        const x = cx + Math.cos(ang) * 92;
        const y = cy + Math.sin(ang) * 92;
        return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#5c6b62">${a[0]}</text>`;
      }).join("");
      return `<svg viewBox="0 0 200 200" width="220" height="220">${grid}
        <polygon points="${pts.map(p => p.join(",")).join(" ")}" fill="rgba(31,74,56,.25)" stroke="#1f4a38" stroke-width="1.6"/>
        ${labels}</svg>`;
    }

    function chart(series, swings) {
      const w = 640, h = 150, pad = 18;
      const ys = (series.wrist_speed || []).map((v) => v == null ? 0 : v);
      if (!ys.length) return "<p class='note'>没有挥拍节奏数据</p>";
      const max = Math.max(...ys, 1);
      const xs = series.t;
      const x0 = xs[0], x1 = xs[xs.length - 1] || 1;
      const nx = (t) => pad + ((t - x0) / (x1 - x0)) * (w - pad * 2);
      const ny = (v) => h - pad - (v / max) * (h - pad * 2);
      let d = "";
      ys.forEach((v, i) => { d += `${i ? "L" : "M"}${nx(xs[i]).toFixed(1)},${ny(v).toFixed(1)} `; });
      const marks = (swings || []).map((s) => {
        const x = nx(s.t != null ? s.t : s.contact_t);
        const color = s.stroke === "forehand" ? "#1f4a38" : "#c9a24a";
        return `<line x1="${x}" x2="${x}" y1="${pad}" y2="${h - pad}" stroke="${color}" stroke-width="1" opacity="0.75"/>`;
      }).join("");
      return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${marks}
        <path d="${d}" fill="none" stroke="#1f4a38" stroke-width="1.8"/></svg>
        <div class="note">绿线为正手上旋，金线为切削或反手</div>`;
    }

    function contactPill(s) {
      if (s.late_contact) return `<span class="pill bad">击球偏晚贴身</span>`;
      if (s.contact_forward != null && s.contact_forward >= 0.1) return `<span class="pill ok">击球点在侧前方</span>`;
      return `<span class="pill ok">击球时机正常</span>`;
    }

    function renderClip(clip) {
      const a = clip.analysis;
      const swings = clip.swings.map((s) => {
        const seen = (s.contact_source === "ball_racket" || s.contact_source === "ball_wrist")
          ? `<span class="pill ok">已看到球</span>`
          : "";
        const figs = ["ready", "takeback", "contact", "follow"].map((k) => {
          const p = s.phases[k];
          const name = { ready: "准备", takeback: "引拍", contact: "击球", follow: "随挥" }[k];
          return `<figure><img src="${p.image}" alt="${name}"/><figcaption>${name} · ${p.t.toFixed(2)}s</figcaption></figure>`;
        }).join("");
        const kind = s.shot_kind === "slice"
          ? `<span class="pill">正手切削</span>`
          : s.shot_kind === "backhand"
            ? `<span class="pill">反手</span>`
            : `<span class="pill">上旋正手</span>`;
        return `<article class="swing">
          <div class="barline"><span>挥拍 ${s.index} · ${s.contact_t.toFixed(1)} 秒</span>${kind}${seen}${contactPill(s)}</div>
          <div class="phases">${figs}</div>
        </article>`;
      }).join("");
      return `
        <div class="grid2">
          <div class="panel">
            <h3>挥拍节奏</h3>
            ${chart(clip.series, clip.swings.map(s => ({...s, stroke: clip.stroke})))}
          </div>
          <div class="panel">
            <h3>教练点评</h3>
            <b>优点</b>
            <ul>${a.strengths.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
            <b>问题</b>
            <ul>${a.problems.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
          </div>
        </div>
        <div class="panel" style="margin-top:16px">
          <h3>训练建议</h3>
          <ul>${a.drills.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
        </div>
        <div class="swings">${swings}</div>`;
    }

    function showReport(data) {
      analyzing.classList.add("hidden");
      reportEl.classList.remove("hidden");
      $("again").hidden = false;
      const o = data.overall;
      const sc = o.scores;
      const tiles = AXES.map(([k, max]) => {
        const v = sc[k] || 0;
        return `<div class="axis"><div class="lab">${k} / ${max}</div><div class="val">${v}</div>
          <div class="track"><i data-w="${(100*v/max).toFixed(1)}"></i></div></div>`;
      }).join("");
      const bars = AXES.map(([k, max]) => {
        const v = sc[k] || 0;
        return `<div class="bar"><span>${k}</span><div class="track"><i style="width:${(100*v/max).toFixed(1)}%"></i></div><b>${v}</b></div>`;
      }).join("");
      const pct = Math.min(100, o.score);
      let cur = 0;
      reportEl.innerHTML = `
        <div class="actions no-print">
          <button class="btn" type="button" onclick="window.print()">导出 / 打印报告</button>
        </div>
        <article class="paper">
          <div class="cover">
            <div>
              <div class="kicker">挥拍测评报告 · 2.0</div>
              <h1>${esc(data.title)}</h1>
              <p class="meta">${esc(data.source_name)} · ${data.view_label}拍摄 · ${data.handedness_label} · ${data.duration_s} 秒</p>
              <p class="meta">识别到挥拍 ${o.n_swings} 次 · 生成于 ${esc(data.generated_at)}${data.tracking && data.tracking.contact_from_ball ? " · 部分击球已按球和拍定位" : ""}</p>
              ${data.summary ? `<p style="margin:12px 0 0">${esc(data.summary)}</p>` : ""}
              ${data.focus ? `<p class="focus" style="margin:10px 0 0;font-weight:650">先抓：${esc(data.focus)}</p>` : ""}
              ${data.overlay_video ? `<video class="overlay" src="${data.overlay_video}" controls playsinline style="margin-top:16px"></video>` : ""}
            </div>
            <div>
              <div class="score-ring" style="--p:${pct}"><div class="inner">
                <div><div class="n">${o.score}</div><div class="g">${o.grade} · ${o.grade_label}</div></div>
              </div></div>
            </div>
          </div>
          <h2 style="font-size:16px;margin:0 0 8px">四维评分</h2>
          <div class="axis-grid">${tiles}</div>
          <div class="scores">
            <div>${radar(sc)}</div>
            <div class="bars">${bars}</div>
          </div>
          ${Array.isArray(data.improvements) && data.improvements.length ? `
          <div class="panel improve">
            <h3>改进建议</h3>
            <ul>${data.improvements.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
          </div>` : ""}
          <div class="panel" style="margin-bottom:18px">
            <h3>全程挥拍节奏</h3>
            ${chart(data.series, data.timeline)}
          </div>
          <div class="tabs" id="tabs">${data.clips.map((c,i) =>
            `<button class="tab ${i===0?"on":""}" data-i="${i}" type="button">${esc(c.label)} · ${c.summary.n_swings} 拍 · ${c.scores["综合"]}分</button>`
          ).join("")}</div>
          <div id="clip"></div>
          <p class="note">${(data.caveats || []).map(esc).join(" ")}</p>
        </article>`;
      requestAnimationFrame(() => {
        reportEl.querySelectorAll(".axis .track i").forEach((el) => {
          el.style.width = el.dataset.w + "%";
        });
      });
      const clipBox = reportEl.querySelector("#clip");
      const paint = () => {
        if (!data.clips.length) {
          clipBox.innerHTML = "<p>没有识别到完整挥拍。</p>";
          return;
        }
        clipBox.innerHTML = renderClip(data.clips[cur]);
        reportEl.querySelectorAll(".tab").forEach((b) => {
          b.classList.toggle("on", +b.dataset.i === cur);
          b.onclick = () => { cur = +b.dataset.i; paint(); };
        });
      };
      paint();
    }

    (async function resumeJob() {
      let id = "";
      try { id = localStorage.getItem(JOB_KEY) || ""; } catch (e) {}
      if (!id) return;
      const res = await fetch("api/jobs/" + id);
      if (!res.ok) { clearJob(); return; }
      const job = await res.json();
      if (job.status === "done") {
        const r = await fetch("api/jobs/" + id + "/report");
        if (!r.ok) { clearJob(); return; }
        upload.classList.add("hidden");
        showReport(await r.json());
        clearJob();
        return;
      }
      if (job.status === "error" || job.status === "cancelled") {
        clearJob();
        return;
      }
      upload.classList.add("hidden");
      analyzing.classList.remove("hidden");
      poll(id);
    })();
  </script>
</body>
</html>
